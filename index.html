<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Os Três Mans</title>
  <meta name="description" content="Os Três Mans: vídeos no YouTube e no TikTok.">
  <style>
    :root {
      --fundo: #111111;
      --cartao: #1d1d1d;
      --texto: #f2f2f2;
      --suave: #c8c8c8;
      --youtube: #cc0000;
      --tiktok: #25f4ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.6;
      text-align: center;
    }

    .pular {
      position: absolute; left: 1rem; top: -4rem;
      background: var(--texto); color: var(--fundo);
      padding: .6rem 1rem; border-radius: 0 0 .4rem .4rem;
    }
    .pular:focus { top: 0; }

    :focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }

    main { width: 100%; max-width: 28rem; }

    .avatar {
      width: 6rem; height: 6rem; margin: 0 auto 1rem;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--cartao);
      border: 3px solid var(--texto);
      font-size: 2.4rem; font-weight: 800;
    }

    h1 { margin: 0; font-size: 2.2rem; line-height: 1.2; }
    .arroba { margin: .2rem 0 1.5rem; color: var(--suave); }

    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }

    .botao {
      display: flex; align-items: center; justify-content: center; gap: .7rem;
      padding: 1rem 1.2rem;
      border-radius: .8rem;
      font-size: 1.15rem; font-weight: 700;
      text-decoration: none;
      transition: transform .15s;
    }
    .botao:hover { transform: translateY(-2px); }
    @media (prefers-reduced-motion: reduce) { .botao { transition: none; } .botao:hover { transform: none; } }

    .botao svg { width: 1.6rem; height: 1.6rem; flex: none; }

    .youtube { background: var(--youtube); color: #ffffff; }
    .tiktok { background: #000000; color: #ffffff; border: 2px solid var(--tiktok); }

    footer { margin-top: 2.5rem; color: var(--suave); font-size: .9rem; }
    footer a { color: var(--texto); }
  </style>
</head>

<body>

  <a class="pular" href="#conteudo">Ir para o conteúdo</a>

  <main id="conteudo">
    <div class="avatar" aria-hidden="true">3</div>
    <h1>Os Três Mans</h1>
    <p class="arroba">@ostresmans</p>

    <ul>
      <li>
        <a class="botao youtube" href="https://www.youtube.com/@ostresmans">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="1" y="4" width="22" height="16" rx="4" fill="#ffffff" />
            <polygon points="10,8.5 10,15.5 16,12" fill="#cc0000" />
          </svg>
          Assistir no YouTube
        </a>
      </li>
      <li>
        <a class="botao tiktok" href="https://www.tiktok.com/@ostresmans">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M13 3h3a5 5 0 0 0 5 5v3a8 8 0 0 1-5-1.7V16a6 6 0 1 1-6-6v3a3 3 0 1 0 3 3z" fill="#ffffff" />
          </svg>
          Seguir no TikTok
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <p><a href="guia.html">Guia de gravação acessível</a></p>
  </footer>

</body>

</html>
